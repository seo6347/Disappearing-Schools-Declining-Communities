    <path id="method-census-west" d="M185 174 C163 175 146 187 131 197 C118 215 111 228 112 249 C106 266 111 286 109 300 C119 316 139 319 151 328 C167 339 176 328 188 317 C201 305 204 288 210 279"/>
    <path id="method-census-centre" d="M176 219 C180 230 184 240 191 249 C204 250 219 249 232 247 C242 247 250 257 245 273 C244 288 253 301 261 314"/>
    <path id="method-census-east" d="M256 145 C278 140 304 146 326 145 C346 145 360 154 376 162 C393 164 408 181 417 197 C428 211 427 230 423 247 C421 268 414 278 403 291 C387 303 370 307 357 315 C379 322 398 326 420 335"/>
    <path id="method-census-cross" d="M188 317 C199 328 215 340 222 353 C239 343 251 327 261 314 C283 310 305 310 322 316 C339 320 347 312 357 315"/>
    <path id="method-census-southwest" d="M109 300 C104 324 102 347 113 368 C122 388 141 401 161 404 C179 407 196 397 213 402 C222 389 221 370 222 353"/>
    <path id="method-census-south" d="M213 402 C215 425 218 447 230 463 C242 480 250 500 267 512 C284 527 302 535 323 532 C347 534 366 523 383 515 C408 499 426 482 433 459 C442 440 444 418 438 395 C435 375 435 354 420 335"/>
    <mask id="method-outline-reveal" maskUnits="userSpaceOnUse" x="70" y="0" width="420" height="550">
      <use href="#method-catchment-shape" fill="none" stroke="white" stroke-width="9" pathLength="1" data-method-outline-mask=""/>
    </mask>
    <mask id="method-census-reveal" maskUnits="userSpaceOnUse" x="70" y="0" width="420" height="550">
      <g fill="none" stroke="white" stroke-width="9" stroke-linecap="round">
        <use href="#method-census-north" data-method-reveal="0"/>
        <use href="#method-census-west" data-method-reveal="1"/>
        <use href="#method-census-centre" data-method-reveal="2"/>
        <use href="#method-census-east" data-method-reveal="3"/>
        <use href="#method-census-cross" data-method-reveal="4"/>
        <use href="#method-census-southwest" data-method-reveal="5"/>
        <use href="#method-census-south" data-method-reveal="6"/>
      </g>
    </mask>
  </defs>
  <g id="method-joint" data-method-new="joint" opacity="0">
    <path d="M392 199 C410 155 446 145 468 174 C504 218 507 275 509 325 C513 400 485 460 438 499 C401 530 370 529 364 480 L347 447 C375 429 391 407 398 381 C406 351 403 324 405 294 C409 252 405 220 392 199 Z" fill="#F4BCC1" stroke="#282828" stroke-width="3.5"/>
