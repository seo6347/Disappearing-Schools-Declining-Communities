    <text x="423" y="358" data-method-before="">100명</text><text x="334" y="275" data-method-before="">50명</text><text x="479" y="278" data-method-before="">50명</text>
    <g data-method-new="calibrated" opacity="0"><path d="M333 262 L379 276 M478 263 L523 278 M421 343 L478 359" stroke="#282828" stroke-width="2"/><text x="330" y="303" fill="#415529">20명</text><text x="475" y="250" fill="#415529">80명</text><text x="423" y="390" fill="#415529">80명</text></g>
    <g id="method-joint-legend" font-family="Noto Sans KR, sans-serif" font-size="20" font-weight="400" fill="#282828"><path d="M271 596 H306" stroke="#F4BCC1" stroke-width="17" stroke-linecap="round"/><text x="328" y="603">A·B초 공동통학구역</text></g>
  </g>
  <g id="method-school-a" data-method-layer="school">
    <path d="M209 230 L242 226 L244 259 L210 262 Z" fill="#F3F0E6" stroke="#282828" stroke-width="3.6" stroke-linejoin="round"/>
    <text x="227" y="252" text-anchor="middle" fill="#282828" font-family="sans-serif" font-size="24" font-weight="800">A</text>
    <text x="197" y="221" text-anchor="end" fill="#282828" font-family="Noto Sans KR, sans-serif" font-size="20" font-weight="700">A초</text>
  </g>
  <g id="method-legend" font-family="Noto Sans KR, sans-serif" font-size="20" fill="#282828">
    <g id="method-point-legend" data-method-new="point-legend" opacity="0"><circle cx="78" cy="596" r="5" fill="#50ca74"/><text x="118" y="603">집계구 대표점</text></g>
    <g data-method-layer="catchment-legend">
      <path d="M61 564 C72 560 86 562 96 563" stroke="#FBF7AE" stroke-width="17" stroke-linecap="round" fill="none"/>
      <text x="118" y="571">A초 통학구역</text>
    </g>
    <g data-method-layer="census-legend">
