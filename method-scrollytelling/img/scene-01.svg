<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 610" role="img" aria-labelledby="method-svg-title method-svg-desc">
  <title id="method-svg-title">A초 통학구역과 집계구</title>
  <desc id="method-svg-desc">하단이 안으로 들어간 불규칙한 노란 통학구역. A초는 영역의 왼쪽 위쪽에 있습니다. 초록 점선 집계구 경계는 통학구역 안팎을 가로지릅니다. 원본 손그림 1쪽을 벡터로 재구성한 가상 예시입니다.</desc>
  <defs>
    <pattern id="method-red-hatch" width="15" height="15" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0 V15" stroke="#ef5941" stroke-width="3"/></pattern>
    <clipPath id="method-k-clip"><use href="#method-catchment-shape"/></clipPath>
    <marker id="method-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ef5941" stroke-width="1.5"/></marker>
    <path id="method-catchment-shape" d="M285 142 C260 140 239 153 207 164 C168 179 137 209 125 248 C112 285 115 322 134 348 C151 372 194 385 224 406 C249 422 259 438 255 460 C251 479 251 491 265 489 C291 481 323 462 347 447 C375 429 391 407 398 381 C406 351 403 324 405 294 C409 252 405 220 392 199 C379 178 358 171 340 159 C325 150 305 143 285 142 Z"/>
