  </g>
  <g id="method-representatives" data-method-new="points" opacity="0" fill="#50ca74">
    <circle cx="160" cy="260" r="5"/><circle cx="307" cy="225" r="5"/><circle cx="151" cy="350" r="5"/><circle cx="320" cy="420" r="5"/><circle cx="220" cy="285" r="5"/><circle cx="200" cy="80" r="5"/>
  </g>
  <g id="method-allocation-lines" data-method-new="links" opacity="0" fill="none" stroke="#ef5941" stroke-width="3" marker-end="url(#method-arrow)">
