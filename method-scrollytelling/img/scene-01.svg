  </g>
  <g id="method-census-boundaries" data-method-layer="census" mask="url(#method-census-reveal)" fill="none" stroke="#40AD62" stroke-width="2.5" stroke-dasharray="8 13" stroke-linecap="round" stroke-linejoin="round">
