<g data-appear="4-2" data-until="4-3"><text x="350" y="35" text-anchor="middle" font-size="23">〈최종 비중복 군집 선택 기준〉</text><g fill="#eae7dc" stroke="#282828" stroke-width="2"><rect x="20" y="65" width="660" height="125" rx="7"/><rect x="20" y="245" width="660" height="125" rx="7"/><rect x="20" y="425" width="660" height="125" rx="7"/></g><g font-weight="700"><text x="45" y="110">① 군집 수 최대화</text><text x="45" y="290">② 접근시간 점수 합 최소화</text><text x="45" y="470">③ 후보 ID 순위로 최종 결정</text></g><g font-size="20"><text x="45" y="146" data-s4-fit-width="610">더 많은 지역을 묶는다</text><text x="45" y="326" data-s4-fit-width="610">군집 수가 같으면 묶인 학교들이 더 가까운 경우가 선정</text><text x="45" y="506" data-s4-fit-width="610">그래도 동률이면 미리 부여된 ID 순위로 결정</text></g><path data-draw="4-2" d="M350 200 V226 M338 214 L350 226 L362 214 M350 380 V406 M338 394 L350 406 L362 394" fill="none" stroke="#282828" stroke-width="3"/></g>
</g></svg>
