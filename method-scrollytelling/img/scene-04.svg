<rect data-s4-highlight="method-s4-K1" x="100" y="-30" width="90" height="56" rx="4" fill="#eddf6580"/><rect data-s4-highlight="method-s4-K2" x="100" y="80" width="90" height="56" rx="4" fill="#85ded080"/><rect data-s4-highlight="method-s4-K3" x="100" y="190" width="90" height="56" rx="4" fill="#91dfac80"/>
